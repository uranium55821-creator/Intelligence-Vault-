<!DOCTYPE html>

<head>

    <title>Abhinav Industries Intelligence</title>

    <!-- ✅ PWA + ICON SETTINGS -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Custom Terminal Animations */
        @keyframes scan {
            0% { top: 0%; }
            100% { top: 100%; }
        }
        .scan-line {
            animation: scan 2s linear infinite;
        }
        .glitch-text {
            text-shadow: 2px 0 #ff0000, -2px 0 #00ff00;
            animation: glitch 0.5s infinite alternate-reverse;
        }
        @keyframes glitch {
            0% { transform: skew(0deg); }
            20% { transform: skew(-2deg); }
            40% { transform: skew(2deg); }
            60% { transform: skew(-1deg); }
            80% { transform: skew(1deg); }
            100% { transform: skew(0deg); }
        }
        @keyframes pulse-red {
            0%, 100% { box-shadow: 0 0 20px rgba(220, 38, 38, 0.2); border-color: rgba(220, 38, 38, 0.5); }
            50% { box-shadow: 0 0 50px rgba(220, 38, 38, 0.6); border-color: rgba(220, 38, 38, 1); }
        }
        .animate-pulse-red {
            animation: pulse-red 2s infinite;
        }
        body { margin: 0; overflow-x: hidden; background-color: black; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Import React and Libraries as Modules -->
    <script type="module">
        import React, { useState, useEffect, useRef, useMemo } from 'https://esm.sh/react@18.2.0';
        import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client';
        import { 
            Shield, Lock, Unlock, Upload, Trash2, FileText, Image as ImageIcon, Film, 
            LogOut, AlertTriangle, Check, X, HardDrive, User, Cpu, Scan, 
            ShieldCheck, Siren, UserX, AlertOctagon, Key, Terminal, Activity, Pen, Clock,
            XCircle, ShieldAlert, Camera
        } from 'https://esm.sh/lucide-react@0.263.1';

        // --- INDEXED DB UTILITIES ---
        const DB_NAME = 'AbhinavVaultDB';
        const STORE_NAME = 'secure_files';
        const DB_VERSION = 1;

        const initDB = () => {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = (event) => reject('DB Error');
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
                request.onsuccess = (event) => resolve(event.target.result);
            });
        };

        const saveFileToDB = async (fileObj) => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.add(fileObj);
                request.onsuccess = () => resolve(fileObj);
                request.onerror = (e) => reject(e);
            });
        };

        const getFilesFromDB = async () => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.getAll();
                request.onsuccess = () => resolve(request.result);
                request.onerror = (e) => reject(e);
            });
        };

        const deleteFileFromDB = async (id) => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.delete(id);
                request.onsuccess = () => resolve(id);
                request.onerror = (e) => reject(e);
            });
        };

        const nukeDB = async () => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.clear();
                request.onsuccess = () => resolve(true);
                request.onerror = (e) => reject(e);
            });
        };

        const requestPersistence = async () => {
            if (navigator.storage && navigator.storage.persist) {
                const isPersisted = await navigator.storage.persisted();
                if (!isPersisted) {
                    await navigator.storage.persist();
                }
            }
        };

        // --- COMPONENTS ---

        const TerminalBackground = ({ children }) => React.createElement('div', { className: "min-h-screen bg-black text-green-500 font-mono relative overflow-hidden selection:bg-green-500/30 selection:text-black flex flex-col" },
            React.createElement('div', { className: "absolute inset-0 pointer-events-none z-50 bg-[linear-gradient(rgba(18,16,16,0)_50%,rgba(0,0,0,0.25)_50%),linear-gradient(90deg,rgba(255,0,0,0.06),rgba(0,255,0,0.02),rgba(0,0,255,0.06))] bg-[length:100%_4px,3px_100%] opacity-20" }),
            React.createElement('div', { className: "absolute inset-0 bg-[linear-gradient(to_right,#1f2937_1px,transparent_1px),linear-gradient(to_bottom,#1f2937_1px,transparent_1px)] bg-[size:4rem_4rem] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_0%,#000_70%,transparent_100%)] opacity-20" }),
            React.createElement('div', { className: "absolute top-0 left-1/2 -translate-x-1/2 w-full h-[500px] bg-green-500/5 blur-[120px] rounded-full pointer-events-none" }),
            React.createElement('div', { className: "relative z-10 h-full flex flex-col w-full" }, children)
        );

        const Button = ({ children, onClick, variant = 'primary', className = '', disabled = false, icon: Icon }) => {
            const baseStyles = "flex items-center justify-center px-4 py-3 rounded-none border font-bold uppercase tracking-widest transition-all duration-200 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed group relative overflow-hidden text-sm md:text-base";
            const variants = {
                primary: "bg-green-900/20 border-green-500 text-green-400 hover:bg-green-500 hover:text-black hover:shadow-[0_0_20px_rgba(34,197,94,0.6)]",
                danger: "bg-red-900/20 border-red-500 text-red-500 hover:bg-red-600 hover:text-white hover:shadow-[0_0_20px_rgba(220,38,38,0.6)]",
                ghost: "bg-transparent border-slate-700 text-slate-400 hover:border-slate-500 hover:text-slate-200",
                outline: "bg-transparent border-slate-600 text-slate-300 hover:border-green-400 hover:text-green-400"
            };
            return React.createElement('button', { onClick, disabled, className: `${baseStyles} ${variants[variant]} ${className}` },
                Icon && React.createElement(Icon, { className: "w-4 h-4 mr-2" }),
                children
            );
        };

        const Input = ({ type = "text", placeholder, value, onChange, icon: Icon, className = "", maxLength, inputMode }) => {
            return React.createElement('div', { className: `relative group ${className}` },
                Icon && React.createElement(Icon, { className: "absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-500 group-focus-within:text-green-400 transition-colors w-4 h-4" }),
                React.createElement('input', {
                    type, inputMode, placeholder, value, onChange, maxLength,
                    className: "w-full bg-black/80 border border-slate-800 text-green-400 rounded-none py-3 pl-10 pr-4 focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500/50 transition-all placeholder:text-slate-700 font-mono text-sm md:text-base"
                })

        };

        const Card = ({ children, className = "" }) => {
            return React.createElement('div', { className: `bg-black/80 backdrop-blur-md border border-slate-800 p-4 md:p-6 shadow-2xl relative ${className}` },
                React.createElement('div', { className: "absolute top-0 left-0 w-2 h-2 border-l-2 border-t-2 border-green-500/50" }),
                React.createElement('div', { className: "absolute top-0 right-0 w-2 h-2 border-r-2 border-t-2 border-green-500/50" }),
                React.createElement('div', { className: "absolute bottom-0 left-0 w-2 h-2 border-l-2 border-b-2 border-green-500/50" }),
                React.createElement('div', { className: "absolute bottom-0 right-0 w-2 h-2 border-r-2 border-b-2 border-green-500/50" }),
                children
            );
        };

        const Modal = ({ isOpen, onClose, title, children, variant = 'danger' }) => {
            if (!isOpen) return null;
            const borderColor = variant === 'danger' ? 'border-red-500' : 'border-slate-700';
            const textColor = variant === 'danger' ? 'text-red-500' : 'text-green-500';
            const Icon = variant === 'danger' ? AlertTriangle : ShieldCheck;

            return React.createElement('div', { className: "fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md animate-in fade-in duration-200 font-mono overflow-y-auto" },
                React.createElement('div', { className: `bg-black border ${borderColor} w-full max-w-lg shadow-[0_0_50px_rgba(0,0,0,0.8)] p-4 md:p-6 relative animate-in zoom-in-95 duration-200 my-auto` },
                    React.createElement('div', { className: "flex justify-between items-center mb-6 border-b border-slate-800 pb-4" },
                        React.createElement('h3', { className: `text-lg md:text-xl font-bold ${textColor} uppercase tracking-widest flex items-center` },
                            React.createElement(Icon, { className: "w-5 h-5 mr-2" }),
                            title
                        ),
                        React.createElement('button', { onClick: onClose, className: "text-slate-500 hover:text-white" },
                            React.createElement(X, { className: "w-6 h-6" })
                        )
                    ),
                    children
                )
            );
        };

        // --- MAIN APPLICATION LOGIC ---

        function AbhinavIntelligenceApp() {
            const [view, setView] = useState('loading');
            const [user, setUser] = useState(null);
            const [passwordInput, setPasswordInput] = useState('');
            const [error, setError] = useState('');
            const [files, setFiles] = useState([]);
            const [loadingFiles, setLoadingFiles] = useState(false);
            const [activeTab, setActiveTab] = useState('all');
            const [showNukeModal, setShowNukeModal] = useState(false);
            const [nukePassword, setNukePassword] = useState('');

            // Security & Logging
            const [masterInput, setMasterInput] = useState('');
            const [accessLogs, setAccessLogs] = useState([]);
            const [showAccessLogsModal, setShowAccessLogsModal] = useState(false);

            // Profile
            const [showDeleteProfileModal, setShowDeleteProfileModal] = useState(false);
            const [deleteProfilePassword, setDeleteProfilePassword] = useState('');
            const [showUpdateProfileModal, setShowUpdateProfileModal] = useState(false);

            // Registration/Reset
            const [regName, setRegName] = useState('');
            const [regPass, setRegPass] = useState('');
            const [regAvatar, setRegAvatar] = useState(null);
            const [avatarError, setAvatarError] = useState('');

            useEffect(() => {
                requestPersistence();
                const isBlocked = localStorage.getItem('abhinav_blocked') === 'true';
                if (isBlocked) {
                    setView('blocked');
                    return;
                }
                const storedUser = localStorage.getItem('abhinav_user');
                if (storedUser) {
                    setUser(JSON.parse(storedUser));
                    setView('login');
                } else {
                    setView('setup');
                }
            }, []);

            // Loading Files
            useEffect(() => {
                if (view === 'vault') loadFiles();
            }, [view]);

            const loadFiles = async () => {
                setLoadingFiles(true);
                try {
                    const dbFiles = await getFilesFromDB();
                    const filesWithUrls = dbFiles.map(f => ({ ...f, url: URL.createObjectURL(f.blob) }));
                    setFiles(filesWithUrls);
                } catch (err) { console.error(err); } 
                finally { setLoadingFiles(false); }
            };

            const handleAvatarChange = (e) => {
                const file = e.target.files[0];
                setAvatarError('');
                if (file) {
                    if (file.size > 2 * 1024 * 1024) {
                        setAvatarError('Image too large. Max 2MB.');
                        e.target.value = null; return;
                    }
                    const reader = new FileReader();
                    reader.onloadend = () => setRegAvatar(reader.result);
                    reader.readAsDataURL(file);
                }
            };

            const handleRegister = (e) => {
                e.preventDefault();
                setError('');
                if (!regName || !regPass) return setError('IDENTIFICATION INCOMPLETE.');
                if (!/^\d{4,8}$/.test(regPass)) return setError('SECURITY PROTOCOL: PIN MUST BE 4-8 DIGITS.');

                const newUser = { name: regName, password: regPass, avatar: regAvatar || 'default' };
                try {
                    localStorage.setItem('abhinav_user', JSON.stringify(newUser));
                    setUser(newUser);
                    setRegName(''); setRegPass(''); setRegAvatar(null);
                    setView('vault');
                } catch (err) { setError('STORAGE ERROR: PROFILE IMAGE TOO LARGE.'); }
            };

            const handleUpdateProfile = (e) => {
                e.preventDefault();
                const updatedUser = { ...user };
                if (regName) updatedUser.name = regName;
                if (regAvatar) updatedUser.avatar = regAvatar;

                try {
                    localStorage.setItem('abhinav_user', JSON.stringify(updatedUser));
                    setUser(updatedUser);
                    setRegName(''); setRegAvatar(null);
                    setShowUpdateProfileModal(false);
                    alert("IDENTITY UPDATED SUCCESSFULLY.");
                } catch (err) {
                    alert("FAILED TO UPDATE IDENTITY. IMAGE TOO LARGE.");
                }
            }

            const handleLogin = (e) => {
                e.preventDefault();
                if (passwordInput === user.password) {
                    setPasswordInput(''); setError(''); setView('vault');
                } else {
                    // LOGGING WRONG PASSWORD ATTEMPT TIME
                    const newLog = {
                        id: crypto.randomUUID(),
                        date: new Date().toISOString()
                    };
                    const existingLogs = JSON.parse(localStorage.getItem('abhinav_access_logs') || '[]');
                    localStorage.setItem('abhinav_access_logs', JSON.stringify([newLog, ...existingLogs].slice(0, 10))); 

                    localStorage.setItem('abhinav_blocked', 'true');
                    setView('blocked');
                    setPasswordInput(''); 
                    setError('');
                }
            };

            const handleMasterUnlock = (e) => {
                e.preventDefault();
                if (masterInput === '1008') {
                    setMasterInput('');
                    
                    const logs = JSON.parse(localStorage.getItem('abhinav_access_logs') || '[]');
                    if (logs.length > 0) {
                        setAccessLogs(logs);
                        setShowAccessLogsModal(true); 
                    } else {
                        localStorage.removeItem('abhinav_blocked');
                        setRegName(user?.name || ''); 
                        setRegAvatar(user?.avatar || null);
                        setView('reset');
                        alert("MASTER OVERRIDE ACCEPTED. INITIATING CREDENTIAL RESET.");
                    }
                } else {
                    alert("INVALID MASTER KEY. TERMINAL LOCKED.");
                    setMasterInput('');
                }
            };

            const handleLogsAcknowledged = () => {
                setShowAccessLogsModal(false);
                localStorage.removeItem('abhinav_access_logs');
                localStorage.removeItem('abhinav_blocked'); 
                setRegName(user?.name || ''); 
                setRegAvatar(user?.avatar || null);
                setView('reset'); 
            };

            const handleLogout = () => { setView('login'); setFiles([]); };

            const handleFileUpload = async (e) => {
                const uploadedFiles = Array.from(e.target.files);
                if (uploadedFiles.length === 0) return;
                setLoadingFiles(true);
                for (const file of uploadedFiles) {
                    const newFile = {
                        id: crypto.randomUUID(), name: file.name, type: file.type, size: file.size,
                        date: new Date().toISOString(), blob: file
                    };
                    try { await saveFileToDB(newFile); } catch (err) { alert(`STORAGE ERROR: ${file.name} failed.`); }
                }
                await loadFiles();
                setLoadingFiles(false);
                setTimeout(() => alert("SECURE TRANSFER COMPLETE. Safe to delete originals."), 500);
            };

            const handleDeleteFile = async (id) => {
                if (!confirm("PERMANENTLY DELETE ASSET?")) return;
                await deleteFileFromDB(id); await loadFiles();
            };

            const handleNukeData = async () => {
                if (nukePassword === user.password) {
                    await nukeDB(); setFiles([]); setShowNukeModal(false); setNukePassword('');
                    alert("SYSTEM PURGED. ALL ASSETS DESTROYED.");
                } else { alert("INCORRECT PASSWORD."); }
            };

            const handleDeleteProfile = async () => {
                if (deleteProfilePassword === user.password || deleteProfilePassword === '1008') {
                    await nukeDB(); localStorage.clear();
                    setUser(null); setFiles([]); setAccessLogs([]);
                    setShowDeleteProfileModal(false); setDeleteProfilePassword('');
                    setView('setup');
                    alert("IDENTITY ERASED. FACTORY RESET COMPLETE.");
                } else { alert("INVALID AUTHORIZATION CODE."); }
            };

            const formatSize = (bytes) => {
                if (bytes === 0) return '0 B';
                const k = 1024; const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            };

            const getFileIcon = (type) => {
                if (type.startsWith('image/')) return React.createElement(ImageIcon, { className: "w-8 h-8 text-purple-500" });
                if (type.startsWith('video/')) return React.createElement(Film, { className: "w-8 h-8 text-red-500" });
                return React.createElement(FileText, { className: "w-8 h-8 text-green-500" });
            };

            const filteredFiles = useMemo(() => {
                if (activeTab === 'all') return files;
                if (activeTab === 'photos') return files.filter(f => f.type.startsWith('image/'));
                if (activeTab === 'videos') return files.filter(f => f.type.startsWith('video/'));
                if (activeTab === 'docs') return files.filter(f => !f.type.startsWith('image/') && !f.type.startsWith('video/'));
                return files;
            }, [files, activeTab]);

            // --- RENDER VIEWS ---

            if (view === 'blocked') {
                return React.createElement(TerminalBackground, {},
                    React.createElement('div', { className: "flex-1 flex items-center justify-center p-4 relative overflow-hidden" },
                        // Background Effects
                        React.createElement('div', { className: "absolute inset-0 bg-red-950/20 z-0 animate-pulse" }),
                        React.createElement('div', { className: "absolute top-0 left-0 text-[10px] text-red-900/30 font-mono whitespace-pre p-2 z-0 overflow-hidden h-full w-full select-none" }, 
                            "SYSTEM_HALT\nERR_AUTH_FAIL\nTRACE_ROUTE_ACTIVE\nPACKET_LOSS_DETECTED\nKERNEL_PANIC\nSECURE_BOOT_VIOLATION\n" + 
                            "SYSTEM_HALT\nERR_AUTH_FAIL\nTRACE_ROUTE_ACTIVE\nPACKET_LOSS_DETECTED\nKERNEL_PANIC\nSECURE_BOOT_VIOLATION\n".repeat(20)
                        ),

                        React.createElement('div', { className: "max-w-md w-full relative z-10" },
                            React.createElement('div', { className: "text-center mb-8" },
                                React.createElement('div', { className: "w-20 h-20 md:w-24 md:h-24 mx-auto mb-4 md:mb-6 relative" },
                                    React.createElement('div', { className: "absolute inset-0 border-4 border-red-600 rounded-full animate-spin border-t-transparent" }),
                                    React.createElement('div', { className: "absolute inset-2 border-2 border-red-900 rounded-full animate-pulse" }),
                                    React.createElement(ShieldAlert, { className: "w-10 h-10 md:w-12 md:h-12 text-red-500 absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2" })
                                ),
                                React.createElement('h1', { className: "text-3xl md:text-5xl font-black text-red-600 uppercase glitch-text tracking-tight" }, "SYSTEM LOCKED"),
                                React.createElement('div', { className: "flex items-center justify-center gap-2 mt-2 md:mt-3 text-red-400 font-mono text-[10px] md:text-xs tracking-[0.2em]" },
                                    React.createElement(Lock, { className: "w-3 h-3" }),
                                    "SECURITY PROTOCOL: OMEGA"
                                )
                            ),
                            React.createElement(Card, { className: "border-red-600/50 bg-black/90 shadow-[0_0_50px_rgba(220,38,38,0.3)] animate-pulse-red" },
                                React.createElement('div', { className: "border-b border-red-900/50 pb-4 mb-6" },
                                    React.createElement('p', { className: "text-xs md:text-sm text-red-500 font-mono text-center uppercase font-bold" }, "Multiple Intrusion Attempts Detected"),
                                    React.createElement('p', { className: "text-[10px] md:text-xs text-red-700 font-mono text-center mt-1" }, "DEVICE FINGERPRINT LOGGED. AWAITING ADMIN OVERRIDE.")
                                ),
                                React.createElement('form', { onSubmit: handleMasterUnlock, className: "space-y-6" },
                                    React.createElement('div', { className: "relative" },
                                        React.createElement('label', { className: "text-[9px] text-red-600 uppercase font-bold absolute -top-3 left-2 bg-black px-1" }, "ADMINISTRATOR KEY"),
                                        React.createElement(Input, { type: "password", placeholder: "ENTER OMEGA KEY", icon: Key, value: masterInput, onChange: e => setMasterInput(e.target.value), className: "border-red-900 text-red-500 placeholder:text-red-900 focus:border-red-500" })
                                    ),
                                    React.createElement(Button, { type: "submit", variant: "danger", className: "w-full shadow-[0_0_20px_rgba(220,38,38,0.4)] hover:shadow-[0_0_30px_rgba(220,38,38,0.6)] transition-all", icon: Unlock }, "DECRYPT SYSTEM")
                                )
                            ),
                            React.createElement('div', { className: "mt-6 text-center" },
                                React.createElement('p', { className: "text-[9px] text-red-900 font-mono" }, "UNAUTHORIZED ACCESS IS A FEDERAL OFFENSE // IP LOGGED")
                            )
                        ),
                        React.createElement(Modal, { isOpen: showAccessLogsModal, onClose: () => {}, title: "SECURITY INCIDENT LOG", variant: "danger" },
                            React.createElement('div', { className: "space-y-4 md:space-y-6" },
                                React.createElement('div', { className: "bg-red-950/30 border border-red-900 p-3 md:p-4 flex gap-3 items-start" },
                                    React.createElement(Siren, { className: "w-5 h-5 md:w-6 md:h-6 text-red-500 animate-pulse flex-shrink-0" }),
                                    React.createElement('div', {},
                                        React.createElement('h4', { className: "text-red-500 font-bold text-xs md:text-sm uppercase" }, "Unauthorized Access Attempts"),
                                        React.createElement('p', { className: "text-red-400/70 text-[10px] md:text-xs" }, "The following incidents were logged while system was locked.")
                                    )
                                ),
                                React.createElement('div', { className: "max-h-60 overflow-y-auto pr-2 space-y-2" },
                                    accessLogs.map(log => 
                                        React.createElement('div', { key: log.id, className: "flex flex-col gap-1 p-3 bg-red-950/20 border border-red-900/30 rounded" },
                                            React.createElement('div', { className: "flex justify-between items-center" },
                                                React.createElement('span', { className: "text-red-400 text-[10px] md:text-xs font-mono flex items-center" },
                                                    React.createElement(Clock, { className: "w-3 h-3 mr-1" }),
                                                    new Date(log.date).toLocaleDateString('en-GB')
                                                ),
                                                React.createElement('span', { className: "text-red-500 text-xs md:text-sm font-bold font-mono" },
                                                    new Date(log.date).toLocaleTimeString()

                                            )
                                        )
                                    )
                                ),
                                React.createElement(Button, { onClick: handleLogsAcknowledged, variant: "ghost", className: "w-full border-red-900 text-red-500 hover:bg-red-900/20" }, "ACKNOWLEDGE & PROCEED")
                            )
                        )
                    )
                );
            }

            if (view === 'setup' || view === 'reset') {
                return React.createElement(TerminalBackground, {},
                    React.createElement('div', { className: "flex-1 flex items-center justify-center p-4" },
